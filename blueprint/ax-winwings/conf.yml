info:
  name: "Ax Win-Wings"
  identifier: "axwinwings"
  description: "Serves the Panel API that win-wings (the Windows-native wings fork) needs: per-egg Windows profiles, PowerShell install scripts, and a creation gate for eggs that have no Windows profile."
  flags: "hasInstallScript,hasRemovalScript"
  version: "1.1.0"
  target: "beta-2026-01"
  author: "AlienX"
  icon: "icon.jpg"

admin:
  view: "admin/view.blade.php"
  controller: "admin/controller.php"

requests:
  app: "app"
  routers:
    web: "routers/web.php"

database:
  migrations: "migrations"

data:
  directory: "data"
